<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0c0d12"><script>
(function(){
  function show(prefix,msg,extra){
    var b=document.createElement('div');
    b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:999999;background:#b00020;color:#fff;padding:14px;font:12px/1.5 monospace;white-space:pre-wrap;max-height:60vh;overflow:auto;box-shadow:0 2px 10px rgba(0,0,0,.5)';
    b.textContent=prefix+': '+msg+(extra?'\n'+extra:'');
    (document.body||document.documentElement).appendChild(b);
  }
  window.addEventListener('error',function(e){
    show('JS ERROR',e.message||String(e.error),(e.filename?e.filename+':'+e.lineno+':'+e.colno:'')+((e.error&&e.error.stack)?'\n'+e.error.stack:''));
  });
  window.addEventListener('unhandledrejection',function(e){
    var r=e.reason;
    show('PROMISE ERROR',(r&&r.message)||String(r),(r&&r.stack)||'');
  });
})();
</script>
<script>try{if(localStorage.getItem("frl-theme")==="light")document.documentElement.dataset.theme="light"}catch(e){}</script><link rel="stylesheet" href="style.css?v=20261027"><title>Team Registration - fRacing Legends</title></head><body>

<script src="core.js"></script>
<script>
let cur=new URLSearchParams(location.search).get('e');
function view(){const op=S.ev.filter(e=>isOpen(e)&&!isFull(e));
if(!op.length)return mount('Team Registration','index.html#/daftar',null,'<p class=m>No events are open for team registration right now, or all team slots are taken.</p>');
let e=op.find(x=>x.id==cur)||op[0];cur=e.id;
mount('Team Registration','index.html#/daftar',null,`<div class=f><label>Event</label><select onchange="cur=this.value;view()">${opt(op.map(x=>[x.id,x.name+' · '+clsOf(x)+' ('+evT(x).length+'/'+x.quota+')']),e.id)}</select></div>`+teamForm(e)+'<button class=bt onclick=send()>Submit Registration</button>',e.col);pfAll(true)}
function send(){Promise.resolve(saveTeam(false)).then(ok=>{if(ok){view();say('Team registered successfully.')}})}
READY.then(view);
</script></body></html>
