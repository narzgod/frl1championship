<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0c0d12"><link rel="stylesheet" href="style.css?v=20261019"><title>fRacing Legends</title></head><body>
<div id="top"><div class="tb" id="tb"></div></div><div class="w"><div id="msg"></div><div id="app"></div></div><div id="bar"></div>
<script src="core.js"></script>
<script src="flags.js"></script>
<script src="export.js"></script>
<script>
const dc=e=>e.col||'#e10600',stripe=(c,c2)=>`--a:${c};--c2:${c2||c};--stripe:linear-gradient(${c},${c2||c})`;
const nameTag=(n,c,c2)=>`<span class=tn style="color:${c};--c2:${c2||'transparent'}">${esc(n)}</span>`;
function pHome(){return'<h2 class=ph>Events</h2>'+(S.ev.length?S.ev.map(e=>`<a class=cd style="--a:${dc(e)}" href="#/e/${e.id}/race"><div class=ev>${e.sp?`<div class=sp>${esc(e.sp)}</div>`:''}<div class=nm>${esc(e.name)}</div><div class=mt><span>${e.cls} · ${evT(e).length}/${e.quota} teams</span><span class="st ${isOpen(e)&&!isFull(e)?'on':''}">${regTxt(e)}</span></div></div></a>`).join(''):'<p class=m>No events yet.</p>')}
function pRace(e){const rs=S.rc.filter(r=>r.ev==e.id);
if(!rs.length)return'<p class=m>No races scheduled yet.</p>';
return'<div class=sec>Race calendar</div>'+rs.map(r=>{const rows=r.fe.length?r.fe:r.sp,top=rows.filter(x=>!x.st).slice(0,3);
return`<a class=cd href="#/r/${r.id}"><div class=rw><div class=fw>${flagImg(r.flag,64,44)}</div><div class=nm>${esc(r.circ)}<small>${esc(r.country)}${r.date?' · '+esc(r.date):''}</small></div><span class="chip ${rows.length?'on':''}">${rows.length?'Completed':'Upcoming'}</span></div>${top.length?`<div class=tp>${top.map((x,i)=>`<span><b class=pb>${i+1}</b><span style="color:${tcR(e,x.did,r,r.fe.length?'fe':'sp')}">${esc(sn(dn(x.did)))}</span></span>`).join('')}</div>`:''}</a>`}).join('')}
function pRes(e,r,ses){const av=Object.keys(NM).filter(s=>get(r,s).length),h0=`<div class=rh><div class=fw style="flex-basis:92px;width:92px">${flagImg(r.flag,92,64)}</div><div><h2>${esc(r.circ)}</h2>`;
if(!av.length)return h0+'</div></div><p class=m>No results yet.</p>';
if(!av.includes(ses))ses=av.includes('fe')?'fe':av.includes('sp')?'sp':av[av.length-1];
const rows=get(r,ses),q=gridQ(r),isR=ses[0]!='q',pole=q[0]?esc(dn(q[0].did)):'-',plt=poleLT(r),stx=x=>!isR&&x=='DNS'?'DNQ':x;
EXP={title:e.name+' - '+r.circ,sub:NM[ses]+(r.date?' - '+r.date:''),note:[['Pole Position',dn((q[0]||{}).did||'')+(plt?' ('+plt+')':'')],isR?['Fastest Lap',dn(r.fl[ses])]:null,isR?['Driver of the Race',dn(r.dr[ses])]:null].filter(x=>x&&x[1]&&x[1]!=' ()'),flag:r.flag};
return h0+`<div>${NM[ses]}</div></div></div><div class=fx>${isR?`<div>Fastest Lap<i>${esc(dn(r.fl[ses])||'-')}</i></div>`:''}<div>Pole Position<i>${pole}${plt?` <span class=lt>${esc(plt)}</span>`:''}</i></div>${isR?`<div>Driver of the Race<i>${esc(dn(r.dr[ses])||'-')}</i></div>`:''}</div>`+
chips(av.map(s=>[NM[s],'#/r/'+r.id+'/'+s,s==ses]))+
tbl(['Pos','No','Driver','Team','Grid','Tyre'],rows.map((x,i)=>{const c=tcR(e,x.did,r,ses),g=isR?(q.findIndex(y=>y.did==x.did)+1||'-'):i+1;
return[`<b class="pb ${x.st?'dim':i==0?'p1':''}">${stx(x.st)||i+1}</b>`,`<span style="color:${c}">${esc(noR(e,x.did,r,ses))}</span>`,esc(dn(x.did)),nameTag(tmR(e,x.did,r,ses).name||'-',txT(tmR(e,x.did,r,ses)),tmR(e,x.did,r,ses).col2),g,tyDot(x.tyre)]}),.3)+expBtn()}
let FULL=false;
const togFull=()=>{FULL=!FULL;render();pgAnim(1)};
const fullBtn=()=>`<button type=button class=bt style="margin:0 0 12px" onclick="togFull()">${FULL?'&lsaquo; Back to compact view':'Show full statistics &rsaquo;'}</button>`;
const tblC=(H,R,fit,vis,ix)=>tbl(ix?ix.map(k=>H[k]):H,R.map(r=>ix?ix.map(k=>r[k]):r),fit,vis);
const vHint=(n,v)=>n>v?`<p class="m vh">Showing Top ${v} of ${n}. Scroll the table to see the rest.</p>`:'';
const sd0=k=>(SC.find(x=>x[0]==k)||SC[12])[1];
function rankView(items,base,scope,stat,isTeam,champ){EXP={title:base.indexOf('board')>0?'Legends Board':'Standings',sub:(isTeam?'Team':'Driver')+' ranking - '+sd0(stat),note:[]};const STEP=isTeam?5:10;EXP.rank={step:STEP,total:items.length};stat=SC.some(x=>x[0]==stat)?stat:'p';const sd=SC.find(x=>x[0]==stat),B=base+'/'+scope+'/';
const cols=FULL?SC:SC.filter(x=>['r','w','pd','p'].includes(x[0])||x[0]==stat),L=[...items].sort((a,b)=>b.v[stat]-a.v[stat]||b.v.p-a.v.p||b.v.w-a.v.w||b.v.pd-a.v.pd),top=L[0],fm=(k,v)=>k=='gp'&&v>0?'+'+v:v;
let h=chips([['Drivers',base+'/drv/'+stat,!isTeam],['Teams',base+'/tim/'+stat,isTeam]])+`<div class=ch>${SC.map(([k,n])=>`<a href="${B}${k}" class="${k==stat?'on':''}">${n}</a>`).join('')}</div>`;
if(champ)h+=`<div class=hero><small>${isTeam?'World Team Champions':'World Driver Champions'}</small><b>${esc(champ.n)}</b></div>`;
h+=top&&(top.v[stat]||stat=='gp')?`<div class=hero><small>${sd[1]} leader</small><b>${esc(top.n)}</b><span>${fm(stat,top.v[stat])}</span></div>`:'';
if(!L.length)return h+'<p class=m>No data yet.</p>';
return h+fullBtn()+tbl(['Pos',isTeam?'Team':'Driver'].concat(isTeam?[]:['Team']).concat(cols.map(x=>`<span class="${x[0]==stat?'hl':''}">${x[2]}</span>`)),
L.map((x,i)=>[`<b class="pb ${i?'':'p1'}">${i+1}</b>`,nameTag(x.n,x.tx||x.c,x.c2)].concat(isTeam?[]:[nameTag(x.t,x.tt||x.c,x.c2)]).concat(cols.map(([k])=>`<span class="${k==stat?'hl':''}">${fm(k,x.v[k])}</span>`))),.62,STEP)+vHint(L.length,STEP)+expBtn()}
function pStand(e,sub,stat){const isT=sub=='tim',it=isT?tItems(e):dItems(e);let ch=null;
if(e.done){const t=[...it].sort((a,b)=>b.v.t-a.v.t)[0];if(t&&t.v.t)ch=t}const h=rankView(it,'#/e/'+e.id+'/stand',sub,stat,isT,ch);const st=SC.some(x=>x[0]==stat)?stat:'p';EXP.title=e.name;EXP.sub=(isT?'Team':'Driver')+' Standings'+(st=='p'?'':' - '+sd0(st));EXP.note=[];return h+`<p class=m style="font-size:12px">${esc(ptsTxt(e))}</p>`}
function pBoard(sub,stat){if(!S.ev.length)return'<p class=m>No events yet.</p>';const B=board();
if(sub=='tim')return rankView(B.t,'#/board','tim',stat,true,null);
const all=lpBoard(),cl=['all'].concat(LCL.map(x=>x[0].toLowerCase())),cur=cl.includes(stat)?stat:'all',L=cur=='all'?all:all.filter(x=>x.cls.toLowerCase()==cur),top=L[0];
let h=chips([['Drivers','#/board/drv/'+cur,1],['Teams','#/board/tim/p',0]])+`<div class=ch>${cl.map(k=>`<a href="#/board/drv/${k}" class="${k==cur?'on':''}">${k=='all'?'All':k=='rookie'?'Rookie':k.length==1?'Class '+k.toUpperCase():'Pro'} <span class=m>${k=='all'?all.length:all.filter(x=>x.cls.toLowerCase()==k).length}</span></a>`).join('')}</div>`;
h+=`<p class=m>Legends Points (LP) = Podiums x 10 + Wins x 20 in each event, multiplied by that event's class multiplier. Class is promoted by total LP: ${LCL.slice(1).map(([n])=>n+' at '+ltOf(n)+' LP').join(', ')}.</p>`;
if(top)h+=`<div class=hero><small>${cur=='all'?'Legends Board leader':'Class leader'}</small><b>${esc(top.n)}</b><span>${top.lp} LP</span></div>`;
EXP={title:'Legends Board',sub:cur=='all'?'All classes':(cur=='rookie'?'Rookie':cur.length==1?'Class '+cur.toUpperCase():'Pro'),note:[],rank:{step:10,total:L.length}};
if(!L.length)return h+'<p class=m>No drivers in this class yet.</p>';
return h+fullBtn()+tblC(['Pos','Driver','Team','Class','Starts','Wins','Podium','Pole','S.Wins','Titles','Win Rate','<span class=hl>LP</span>'],L.map((x,i)=>[`<b class="pb ${i?'':'p1'}">${i+1}</b>`,nameTag(x.n,x.tx||x.c,x.c2),nameTag(x.t,x.tt||x.c,x.c2),'<b>'+x.cls+'</b>',x.v.r,x.v.w,x.v.pd,x.v.po,x.v.sw,x.v.t,x.wr+'%',`<span class=hl>${x.lp}</span>`]),FULL?.3:.6,10,FULL?null:[0,1,2,3,9,10,11])+vHint(L.length,10)+expBtn()}
function pTeams(e){const ts=evT(e),ok=isOpen(e)&&!isFull(e),rc=rsCount(e);
return`<div class=hero><small>Team slots</small><b>${ts.length} / ${e.quota}</b><span>${regTxt(e)}</span></div>`+(ok?`<a class=cd href="daftar-tim.html?e=${e.id}"><div class=rw><div class=nm>Register a team<small>Open the team registration page</small></div><span>&rsaquo;</span></div></a>`:'')+
(ts.length?'<div class=sec>Entry list</div>':'<p class=m>No teams registered yet.</p>')+ts.map(t=>`<div class=cd style="${stripe(t.col||'#8b93a7',t.col2)}"><div class=rw><div class=nm style="color:${txT(t)}">${esc(t.name)}<small>${e.soc&&t.soc?esc(t.soc)+' · ':''}Team Principal ${esc(t.tp)} · Team Owner ${esc(t.ow)}</small></div></div><div class=tp>${t.d.map((d,i)=>d?`<span class=m>${['D1','D2','R1','R2'][i]}</span><span>${(t.num||{})[d]?'#'+t.num[d]+' ':''}${esc(dn(d))}${i>1?` <span class=m style="${(rc[t.id+'|'+(i-1)]||0)>=RSL?'color:var(--a)':''}">&middot; reserve left ${Math.max(0,RSL-(rc[t.id+'|'+(i-1)]||0))}/${RSL}</span>`:''}</span>`:'').join('')}</div></div>`).join('')}
function pTyres(e){const all=evD(e),ds=all.filter(d=>!tyHid(e,d));if(!all.length)return'<p class=m>No drivers yet.</p>';if(!ds.length)return'<p class=m>All drivers are hidden from this list.</p>';
const qt=e.qm=='each'?'Qualifying counts every session.':'Qualifying counts once per race.';
EXP={title:e.name,sub:'Tyre Stock',note:[['q','Qualifying'],['r','Race']].map(([k,n])=>['Total stock - '+n,TC.map(c=>c+' '+tyLim(e,k,c)).join(' \u00b7 ')])};
const th2=TC.map((c,i)=>`<th class="tg2${i==0?' tgl':''}">${tyFull(c)}</th>`).join('');
return`<p class=m>Tyres left per driver. ${calN(e)} races in the calendar, 1 tyre per race. ${qt}</p>`+`<div class=sc data-fit=".3"><table class=tt><tr><th rowspan=2>Driver</th><th colspan=3 class=tgl>Qualifying</th><th colspan=3 class=tgl>Race</th></tr><tr>${th2}${th2}</tr>`+ds.map(d=>{const u=tyUsed(e,d);return`<tr><td>${nameTag(dn(d),tc(e,d),tmO(e,d).col2)}</td>`+['q','r'].flatMap(k=>TC.map((c,i)=>{const t=tyLim(e,k,c),l=tyTot(e,d,k,c)-u[k][c];return`<td class="tg2${i==0?' tgl':''}"><span style="${l<=0?'color:var(--a);font-weight:800':''}">${l}<span class=m>/${t}</span></span></td>`})).join('')+'</tr>'}).join('')+'</table></div>'+expBtn()}
function pReserves(e){const ts=evT(e);if(!ts.length)return'<p class=m>No teams registered yet.</p>';const rc=rsCount(e),L=(t,n)=>Math.max(0,RSL-(rc[t.id+'|'+n]||0)),
cell=(t,n)=>{const u=rc[t.id+'|'+n]||0;if(!t.d[n+1]&&!u)return'<td class="tg2 tgl"><span class=m>-</span></td>';return`<td class="tg2 tgl"><span style="${L(t,n)<=0?'color:var(--a);font-weight:800':''}">${L(t,n)}<span class=m>/${RSL}</span></span></td>`},
un=Object.keys(rc).filter(k=>k.indexOf('|u')>0).map(k=>{const t=ts.find(z=>z.id==k.slice(0,k.indexOf('|')))||{};return dn(k.slice(k.indexOf('|u')+2))+' ('+(t.name||'?')+')'});
EXP={title:e.name,sub:'Reserve Usage',note:[['Limit',RSL+' races per reserve'],['Counting','once per race round']]};
return`<p class=m>Reserve races left per team. Reserve 1 and Reserve 2 can each race ${RSL} times; 0 means the limit is reached, and a dash means the team has no reserve registered. The count stays with the seat, so it carries over when drivers swap seats. Sprint + Race in the same round counts once.</p>`+(un.length?`<p class="m vh" style="color:var(--a)">Seat not set for: ${esc(un.join(', '))}. Open those race results, choose Reserve 1 or 2 and save.</p>`:'')+`<div class=sc data-fit=".3"><table class="tt rv"><tr><th>Team</th><th class=tgl>Reserve 1</th><th class=tgl>Reserve 2</th></tr>`+ts.map(t=>`<tr><td>${nameTag(t.name,txT(t),t.col2)}</td>${cell(t,1)}${cell(t,2)}</tr>`).join('')+'</table></div>'+expBtn()}
function pDaftar(){const n=S.ev.filter(e=>isOpen(e)&&!isFull(e)).length;return`<p class=m>Choose what you'd like to register.</p><a class=cd href="daftar-driver.html"><div class=rw><div class=nm>Driver License<small>Register your name, 4-digit DID and WhatsApp number</small></div><span>&rsaquo;</span></div></a><a class=cd href="daftar-tim.html"><div class=rw><div class=nm>Team Registration<small>${n} event${n==1?'':'s'} open for team entries</small></div><span>&rsaquo;</span></div></a>`}
function render(){const p=location.hash.slice(1).split('/'),k=p[1];let A='#e10600',T='',bk='',b,tb,e,r;
const rt=a=>[['Events','#/'],['Legends Board','#/board'],['Register','#/daftar']].map(([n,h],i)=>[n,h,i==a]);
const et=(e,a)=>[['Races','#/e/'+e.id+'/race'],['Standings','#/e/'+e.id+'/stand'],['Teams','#/e/'+e.id+'/teams'],['Tyres','#/e/'+e.id+'/tyres'],['Reserves','#/e/'+e.id+'/reserves']].map(([n,h],i)=>[n,h,i==a]);
if(k=='e'&&(e=S.ev.find(x=>x.id==p[2]))){A=dc(e);T=e.name;TSP=e.sp||'';TSL=e.slogo||'';TEV=e;bk='#/';const s=p[3]||'race';b=s=='stand'?pStand(e,p[4],p[5]):s=='teams'?pTeams(e):s=='tyres'?pTyres(e):s=='reserves'?pReserves(e):pRace(e);tb=et(e,['race','stand','teams','tyres','reserves'].indexOf(s))}
else if(k=='r'&&(r=S.rc.find(x=>x.id==p[2]))&&(e=S.ev.find(x=>x.id==r.ev))){A=dc(e);T=e.name;TSP=e.sp||'';TSL=e.slogo||'';TEV=e;bk='#/e/'+e.id+'/race';b=pRes(e,r,p[3]);tb=et(e,0)}
else if(k=='board'){T='Legends Board';b=pBoard(p[2],p[3]);tb=rt(1)}
else if(k=='daftar'){T='Register';b=pDaftar();tb=rt(2)}
else{b=pHome();tb=rt(0)}
mount(T,bk,tb,b,A)}
window.onhashchange=()=>{say('');render();scrollTo(0,0)};render();READY.then(render);
</script></body></html>
