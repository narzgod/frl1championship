function saveEv(id){const x=S.ev.find(e=>e.id==id);if(!x)return;const n=$('#ee_n').value.trim().replace(/\s+/g,' '),q=parseInt($('#ee_q').value),cal=parseInt($('#ee_cal').value),c=colorVal('eecl'),nt=evT(x).length;

function pickR(i,d){$('#p'+i).value=d;$('#k'+i).value='';$('#sk'+i).innerHTML='';syncT(i)}
function sgD(inp,i){const e=E(),q=inp.value.trim().toLowerCase(),box=$('#sk'+i),sel=$('#p'+i);if(!q){box.innerHTML='';return}
