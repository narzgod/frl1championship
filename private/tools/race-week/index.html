<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Race Week Poster Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Oswald:wght@700&family=Archivo+Black&family=Russo+One&family=Teko:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f2f0;--pn:#fff;--tx:#17171a;--mu:#6b6b73;--ln:#dcdce0;--ac:#e10600;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e11;--pn:#1a1a1f;--tx:#f1f1f3;--mu:#9a9aa5;--ln:#2e2e36}}
:root[data-theme="dark"]{--bg:#0e0e11;--pn:#1a1a1f;--tx:#f1f1f3;--mu:#9a9aa5;--ln:#2e2e36}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,sans-serif}
.app{display:block;padding:10px;max-width:1100px;margin:auto}
@media(min-width:860px){.app{display:grid;gap:12px;grid-template-columns:auto 1fr;align-items:start}.stage{top:10px}}
.stage{text-align:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:4px 0 8px}
canvas{height:min(44vh,calc((100vw - 20px)*1.25));aspect-ratio:4/5;width:auto;max-width:100%;border-radius:8px;box-shadow:0 4px 24px #0004;touch-action:none;background:#333}
@media(min-width:860px){canvas{height:min(88vh,860px)}}
.hint{font-size:12px;color:var(--mu);margin:6px 0 0}
@media(max-width:859px){.hint{display:none}}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:10px;margin-bottom:10px}
.pn h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}
button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:7px 10px;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
.add{display:flex;flex-wrap:wrap;gap:6px}
.li{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 6px 4px 10px;border:1px solid var(--ln);border-radius:8px;margin-bottom:4px;cursor:pointer}
.li.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,transparent)}
.li b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li button{padding:3px 8px}
.row{display:block;margin-bottom:8px}.row span{font-size:12px;color:var(--mu)}.row em{font-style:normal;float:right;font-size:12px;color:var(--mu)}
.row input[type=range],.row select,.row textarea{width:100%;display:block}
.row input[type=color]{width:100%;height:32px;padding:0;border:1px solid var(--ln);border-radius:6px;background:none}
.row select,.row textarea{font:inherit;padding:6px;border-radius:6px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
.row input[type=range]{accent-color:var(--ac)}
#msg{font-size:12px;color:var(--ac);margin-top:6px;min-height:16px}
@font-face{font-family:"MotoGP Display";src:url(fonts/MotoGP-Display-Bold.ttf) format("truetype");font-weight:normal;font-style:normal}
@font-face{font-family:"MotoGP Text";src:url(fonts/MotoGP-Text-Regular.ttf) format("truetype");font-weight:normal;font-style:normal}
@font-face{font-family:"MotoGP Text Bold";src:url(fonts/MotoGP-Text-Bold.ttf) format("truetype");font-weight:normal;font-style:normal}

.tools{min-width:0}
details{border:1px solid var(--ln);border-radius:8px;margin-bottom:8px;background:var(--bg)}
summary{cursor:pointer;padding:9px 10px;font-weight:600;font-size:13px;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:'▾';color:var(--mu);transition:transform .15s}
details[open]>summary::after{transform:rotate(180deg)}
details[open]>summary{border-bottom:1px solid var(--ln)}
.sb{padding:10px 10px 2px}
.note{font-size:12px;color:var(--mu);margin:0 0 8px}
.rg{display:flex;align-items:center;gap:6px}
.row .rg input[type=range]{flex:1;min-width:0;width:auto}
.rg button{flex:none;width:30px;height:30px;padding:0;border-radius:50%;line-height:1;font-size:16px}
.row.chk{display:flex;align-items:center;gap:8px;padding:6px 0}
.row.chk span{font-size:13px;color:var(--tx)}
.pad{width:100%;max-width:220px;aspect-ratio:1;margin:4px auto 8px;border:1px solid var(--ln);border-radius:10px;background:var(--pn);touch-action:none;cursor:crosshair}
.pad svg{width:100%;height:100%;display:block}
.pad .pg{stroke:var(--ln);stroke-width:1;fill:none}
.pad .pl{stroke:var(--ac);stroke-width:2}
.pad .pd{fill:var(--ac);stroke:#fff;stroke-width:2}
@media(max-width:859px){
html,body{height:100%;overflow:hidden}
.app{display:flex;flex-direction:column;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding:0 10px}
.stage{position:relative;top:auto;flex:none;padding:6px 0;border-bottom:1px solid var(--ln)}
.tools{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:8px 0 40px}
canvas{height:min(42vh,calc((100vw - 20px)*1.25))}
}
@supports(height:1dvh){@media(max-width:859px){canvas{height:min(42dvh,calc((100vw - 20px)*1.25))}}}
</style></head><body>
<div class="app">
<div class="stage"><canvas id="cv" width="1080" height="1350"></canvas>
<p class="hint">Tap objek di poster lalu geser. Atur detail di panel bawah.</p></div>
<div class="tools">
<div class="pn"><h3>Tambah</h3><div class="add" id="ad">
<button data-add="text">+ Teks 3D</button><button data-add="driver">+ Driver</button><button data-add="logo">+ Logo</button><button data-add="flag">+ Bendera</button><button data-add="track">+ Foto Track</button><button data-add="car">+ Mobil</button><button data-add="light">+ Cahaya</button><button data-add="img">+ Gambar</button></div></div>
<div class="pn"><h3>Layer (atas → bawah)</h3><div id="ls"></div></div>
<div class="pn"><h3>Properti layer</h3><div id="pr"></div></div>
<div class="pn"><h3>Latar &amp; efek global</h3><div id="gl"></div></div>
<div class="pn"><button class="p" id="ex" style="width:100%">Simpan poster (PNG 1080×1350)</button><div id="msg"></div></div>
</div></div>
<script>
const W=1080,H=1350,cv=document.getElementById('cv'),cx=cv.getContext('2d'),$=s=>document.querySelector(s);
const FONTS=['MotoGP Display','MotoGP Text','MotoGP Text Bold','Anton','Bebas Neue','Oswald','Archivo Black','Russo One','Teko','Impact'];
const BL=[['source-over','Normal'],['screen','Screen'],['lighter','Tambah'],['overlay','Overlay'],['soft-light','Soft Light'],['multiply','Multiply'],['color-dodge','Dodge']];
const TEXO=[['none','Polos']];const FD={};const def=(c,name,ar,fn)=>FD[c]={name,ar,fn};
const rect=(g,c,x,y,w,h)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
const sp=(g,w,h,d,...c)=>{c=c.map(x=>typeof x=='string'?[1,x]:x);const t=c.reduce((a,x)=>a+x[0],0);let p=0;c.forEach(([k,col])=>{const n=k/t*(d=='h'?h:w);d=='h'?rect(g,col,0,p,w,n+1):rect(g,col,p,0,n+1,h);p+=n})};
const star=(g,x,y,R,n=5,col='#fff',rot=-Math.PI/2)=>{g.fillStyle=col;g.beginPath();for(let i=0;i<n*2;i++){const r=i%2?R*(n==5?.382:.5):R,a=rot+i*Math.PI/n;g[i?'lineTo':'moveTo'](x+r*Math.cos(a),y+r*Math.sin(a))}g.closePath();g.fill()};

const jack=(g,w,h)=>{const u=h/30;rect(g,'#012169',0,0,w,h);g.save();g.beginPath();g.rect(0,0,w,h);g.clip();[['#ffffff',6],['#c8102e',2]].forEach(([c,k])=>{g.strokeStyle=c;g.lineWidth=k*u;g.beginPath();g.moveTo(0,0);g.lineTo(w,h);g.moveTo(w,0);g.lineTo(0,h);g.stroke()});rect(g,'#ffffff',0,h/2-5*u,w,10*u);rect(g,'#ffffff',w/2-5*u,0,10*u,h);rect(g,'#c8102e',0,h/2-3*u,w,6*u);rect(g,'#c8102e',w/2-3*u,0,6*u,h);g.restore()};

def('MX','Meksiko (lambang disederhanakan)',7/4,(g,w,h)=>{sp(g,w,h,'v','#006847','#ffffff','#ce1126');g.fillStyle='#a9783a';g.beginPath();g.arc(w/2,h/2,.12*h,0,7);g.fill();g.strokeStyle='#2e7d32';g.lineWidth=.03*h;g.beginPath();g.arc(w/2,h/2,.17*h,.15*Math.PI,.85*Math.PI);g.stroke()});
def('BR','Brasil (disederhanakan)',10/7,(g,w,h)=>{rect(g,'#009c3b',0,0,w,h);const X=x=>x/20*w,Y=y=>y/14*h;g.fillStyle='#ffdf00';g.beginPath();g.moveTo(X(1.7),Y(7));g.lineTo(X(10),Y(1.2));g.lineTo(X(18.3),Y(7));g.lineTo(X(10),Y(12.8));g.closePath();g.fill();const R=Y(3.5);g.save();g.beginPath();g.arc(w/2,h/2,R,0,7);g.clip();rect(g,'#002776',0,0,w,h);g.strokeStyle='#ffffff';g.lineWidth=R*.22;g.beginPath();g.arc(w/2,h/2+R*1.15,R*1.35,Math.PI*1.2,Math.PI*1.8);g.stroke();g.restore()});
