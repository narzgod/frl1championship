#sv{display:flex;gap:8px;justify-content:center;margin-top:8px}

nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.p{display:none;padding:10px}.p.on{display:block}
.card{background:var(--pn);border:1px solid var(--ln);border-left:4px solid var(--ac);border-radius:10px;padding:12px;margin-bottom:10px}
h3{margin:0 0 8px;font-size:15px}
label{display:block;color:var(--mu);font-size:12px;margin:10px 0 3px}
input[type=text],select,textarea{width:100%;min-height:44px;background:#0c0d0f;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:0 10px;font-size:15px}
textarea{padding:10px;min-height:150px;font-family:ui-monospace,monospace;font-size:13px;line-height:1.5;resize:vertical}
input[type=range]{width:100%;accent-color:var(--ac);height:32px}
input[type=color]{width:44px;height:44px;flex:none;border:1px solid var(--ln);border-radius:8px;background:none;padding:2px}
input[type=file]{width:100%;font-size:13px;color:var(--mu)}
.btn{min-height:44px;padding:0 14px;background:#22272d;color:var(--tx);border:1px solid var(--ln);border-radius:8px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.btn.ac{background:var(--ac);border-color:var(--ac)}.btn.sel{background:var(--ac);border-color:var(--ac)}.btn.x{color:#ff6b7f}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>input[type=file]{flex:1;min-width:0}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.g3 .btn,.g2 .btn{padding:0 6px;font-size:13px}
small{color:var(--mu);display:block;margin-top:4px}
.tc{display:flex;gap:10px;align-items:center;margin-bottom:6px}.tc b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ok{color:#4cd97b;font-size:12px;margin-left:6px}
