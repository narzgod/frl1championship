<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Poster Studio</title>
<style>
:root{--bg:#0c0d0f;--pn:#16191d;--ln:#2a2f36;--tx:#eceef0;--mu:#8d96a0;--ac:#c8102e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
#stage{position:sticky;top:0;z-index:5;background:#050506;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;text-align:center;border-bottom:1px solid var(--ln)}
canvas{height:40vh;width:auto;max-width:100%;aspect-ratio:4/5;touch-action:none;border-radius:4px}
#hint{color:var(--mu);font-size:12px;margin-top:4px}
nav{display:flex;gap:6px;padding:10px 10px 0;overflow-x:auto}
nav button{flex:1;min-width:76px;min-height:44px;background:var(--pn);color:var(--mu);border:1px solid var(--ln);border-radius:8px;font-weight:700;white-space:nowrap}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.p{display:none;padding:10px}.p.on{display:block}
.card{background:var(--pn);border:1px solid var(--ln);border-left:4px solid var(--ac);border-radius:10px;padding:12px;margin-bottom:10px}
h3{margin:0 0 8px;font-size:15px}
label{display:block;color:var(--mu);font-size:12px;margin:10px 0 3px}
input[type=text],select,textarea{width:100%;min-height:44px;background:#0c0d0f;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:0 10px;font-size:15px}
input[type=range]{width:100%;accent-color:var(--ac);height:32px}
input[type=color]{width:44px;height:44px;flex:none;border:1px solid var(--ln);border-radius:8px;background:none;padding:2px}
.cf{display:flex;gap:8px;align-items:center}
.cf .hx{flex:1;min-width:0;font-family:ui-monospace,monospace;text-transform:lowercase}
.bad{border-color:#ff6b7f!important}
.btn{min-height:44px;padding:0 14px;background:#22272d;color:var(--tx);border:1px solid var(--ln);border-radius:8px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ac{background:var(--ac);border-color:var(--ac);width:100%}
.btn.sel{background:var(--ac);border-color:var(--ac)}
.btn.x{color:#ff6b7f}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .cf{flex:1}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid3 .btn{padding:0 4px;font-size:13px}
.thumb{width:56px;height:56px;flex:none;border-radius:8px;background:#0c0d0f center/contain no-repeat;border:1px solid var(--ln)}
small{color:var(--mu)}
.dp{display:grid;grid-template-columns:repeat(3,58px);gap:6px;justify-content:center;margin:10px 0}
.dp button{height:54px;font-size:20px;background:#22272d;color:var(--tx);border:1px solid var(--ln);border-radius:10px;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.dp button:active{background:var(--ac)}
.pthumb{display:block;width:100%;height:70px;background:#0c0d0f center/contain no-repeat;border-radius:6px;margin-bottom:4px}
textarea{padding:10px;min-height:76px;font-family:inherit;resize:vertical}
</style></head><body>
<div id="stage"><canvas id="c" width="1080" height="1350"></canvas><div id="hint"></div></div>
<nav id="tabs"></nav>
<div id="panels"></div>

function shText(c,s,x,y,z,sh){

 if(sh.st=='soft'){pass(z*.16,0,z*.04*dd,.55);pass(z*.06,0,z*.018*dd,.55);pass(z*.015,0,z*.007*dd,.6)}
 else if(sh.st=='deep'){pass(z*.07,z*.045*dd,z*.06*dd,.75);pass(z*.02,z*.012*dd,z*.016*dd,.8)}
 else if(sh.st=='halo'){pass(z*.2,0,0,.75);pass(z*.08,0,0,.75);pass(z*.025,0,0,.6)}
 else if(sh.st=='extrude'){const n=Math.max(1,Math.round(z*.05*dd));c.save();c.fillStyle=col;for(let i=n;i>=1;i--)c.fillText(s,x+i*.7071,y+i*.7071);c.restore();pass(z*.1,n*.7071,n*.7071+z*.02,.5)}}

  const widths=()=>lines.map((s,i)=>{setF(c,fn(i),z,sp);return c.measureText(s).width-sp+(fl&&i==fl.li?fg().ex:0)});
  let ws=widths(),bw=Math.max(...ws);if(bw>maxW&&bw>0){const r=maxW/bw;z*=r;sp*=r;ws=widths();bw=Math.max(...ws)}

 ${a.colors.length<4?`<div class="row"><input type="text" id="nh-${a.id}" placeholder="#RRGGBB" maxlength="7" autocapitalize="off" style="flex:1;width:auto"><button class="btn" data-act="addcol" data-id="${a.id}">+ Tambah warna</button></div>`:'<small>Sudah 4 warna.</small>'}
 ${S.teams.length>1?`<button class="btn x" data-act="delteam" data-id="${a.id}" style="margin-top:8px">Hapus tim</button>`:''}</div>`).join('')
 +`<button class="btn ac" data-act="addteam">+ Tambah tim</button></div>`;
 const tl=Z.tl;
 const teamCard=`<div class="card"><div class="row" style="justify-content:space-between"><h3>Logo tim</h3><button class="btn ${selLogo=='team'?'sel':''}" data-act="selteam">${selLogo=='team'?'Sedang digeser':'Pilih untuk digeser'}</button></div>
 ${t.logo?'':'<small>Tim ini belum punya logo. Unggah di tab Tim.</small>'}
 <label>Pindah cepat</label>${pgrid(POS9,tl.pos,'tlpos')}
 ${rng('Ukuran','data-b="tl.sz"',tl.sz,30,300)}${rng('Geser kiri / kanan','data-b="tl.ox"',tl.ox,-1000,1000)}${rng('Geser atas / bawah','data-b="tl.oy"',tl.oy,-1400,1400)}${rng('Jarak dari tepi poster','data-b="tl.m"',tl.m,0,300)}</div>`;
 const p4=teamCard+Z.logos.map((l,i)=>`<div class="card"><div class="row" style="justify-content:space-between"><div class="row"><div class="thumb" style="background-image:url(${l.src})"></div><b>Logo ${i+1}</b></div><button class="btn x" data-act="dellogo" data-id="${l.id}">Hapus</button></div>
 <button class="btn ${l.id==selLogo?'sel':''}" data-act="sel" data-id="${l.id}" style="width:100%;margin-top:8px">${l.id==selLogo?'Sedang digeser di poster':'Pilih untuk digeser di poster'}</button>
 <label>Pindah cepat</label>${pgrid(POS6,'','pos','data-id="'+l.id+'"')}
 ${rng('Ukuran',lat(l,'w'),Math.round(l.w),40,900)}${rng('Geser kiri / kanan',lat(l,'x'),Math.round(l.x),0,W)}${rng('Geser atas / bawah',lat(l,'y'),Math.round(l.y),0,H)}${rng('Transparan',lat(l,'o'),l.o,.1,1,.01)}</div>`).join('')
 +`<div class="card"><h3>Tambah logo</h3><input type="file" accept="image/*" data-act="newlogo"><small>PNG dengan latar transparan hasilnya paling bagus. Logo baru muncul di tengah atas.</small></div>`;
 $('#panels').innerHTML=[p0,pT,p1,p2,p3,p4].map((h,i)=>`<div class="p ${i==tab?'on':''}">${h}</div>`).join('');

function setB(p,v){const ks=p.split('.');let o;if(ks[0]=='cur'){S.curs=S.curs||{};S.curs[S.tpl]=v;S.cur=v;return}if(ks[0]=='tpl')o=S;else if(ks[0]=='ph'){o=PH();ks.shift()}else o=Q();while(ks.length>1)o=o[ks.shift()];o[ks[0]]=v}
const coll=n=>(n=='layers'||n=='logos')?Q()[n]:S[n];
function assign(el,v){const d=el.dataset;
 if(d.b){if(d.b=='bg.mode'&&v=='custom'){const [ca,cb]=bgColors(Q().bg,T());Q().bg.a=ca;Q().bg.b=cb}setB(d.b,v);if(d.b=='cur')syncName(S.tpl);return}
 if(d.pose!==undefined){const [di,pi]=d.pose.split(':'),p=S.drivers.find(x=>x.id==di).poses.find(x=>x.id==pi);p.name=v;return}
 if(d.l){const it=coll(d.l).find(a=>a.id==d.id);if(!it)return;if(d.l=='layers'&&d.f=='c'&&v==6)it.hex=lcol(it,T());it[d.f]=v;if(d.l=='drivers'&&[S.cur,...Object.values(S.curs||{})].includes(it.id)&&d.f=='name')syncName();return}
 if(d.ci!==undefined)S.teams.find(a=>a.id==d.id).colors[d.ci]=v}
function onVal(e){
 const el=e.target,d=el.dataset;let v=el.value;
 if(!(d.b||d.l||d.ci!==undefined||d.pose!==undefined))return;
 if(el.type=='color'||d.hx!==undefined){const n=nh(v);
  if(!n){if(e.type=='change'){el.value=el.parentElement.querySelector('input[type=color]').value;el.classList.remove('bad')}else el.classList.add('bad');return}
  el.classList.remove('bad');v=n;el.parentElement.querySelectorAll('input').forEach(i=>{if(i!==el&&i.value!==n)i.value=n});if(e.type=='change'&&d.hx!==undefined)el.value=n}
 else if(el.type=='range'||d.n)v=Number(v);
 assign(el,v);draw();save();if(e.type=='change'&&d.r)ui()}
document.addEventListener('input',onVal);
function snap(l,p){const hw=l.w/2,hh=l.w*l.ar/2;l.x=p[1]=='l'?60+hw:p[1]=='r'?W-60-hw:W/2;l.y=p[0]=='t'?60+hh:H-60-hh}
document.addEventListener('change',e=>{
 const el=e.target,a=el.dataset.act,f=el.files&&el.files[0];
 if(el.dataset.pc){presetCol=el.value;return}
 if(a=='bkfile'&&f){f.text().then(t=>{try{S=mig(JSON.parse(t));Promise.all(S.fonts.map(x=>loadF(x.v,`url(${x.d})`))).then(()=>{save();ui()})}catch(er){alert('File data tidak bisa dibaca.')}});el.value='';return}
 if(f&&a=='posephoto')pic(f,1600,u=>{const dr=S.drivers.find(d=>d.id==el.dataset.id),p=dr.poses.find(x=>x.id==el.dataset.pid);p.photo=u;save();ui()});
 else if(f&&a=='flagup')pic(f,500,u=>{Q().flag.src=u;Q().flag.mode='custom';save();ui()});
 else if(f&&a=='logo')pic(f,600,u=>{S.teams.find(d=>d.id==el.dataset.id).logo=u;save();ui()});
 else if(f&&a=='newlogo')pic(f,900,(u,w,h)=>{const l={id:uid(),src:u,ar:h/w,x:W/2,y:200,w:240,o:1};snap(l,'tc');Q().logos.push(l);selLogo=l.id;save();ui()});
 else if(f&&a=='font'){const r=new FileReader();r.onload=()=>{const o={v:'U'+uid(),l:f.name.replace(/\.\w+$/,''),d:r.result};S.fonts.push(o);userFont(o).then(()=>{if(S.tpl=='pole')Q().pt.head.f=o.v;else Q().txt.hf=o.v;save();ui()})};r.readAsDataURL(f)}
 else onVal(e)});
const fixSel=()=>{if(selLogo!='team'&&!Q().logos.find(l=>l.id==selLogo))selLogo='team'};
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.tagName=='INPUT')return;
 const a=b.dataset.act,id=b.dataset.id,Z=Q(),tm=S.teams.find(x=>x.id==id),lg=Z.logos.find(x=>x.id==id);
 if(a=='tab'){tab=+b.dataset.i;fixSel();ui();return}
 if(a=='settpl'){S.tpl=b.dataset.v;selTx='head';fixSel()}
 if(a=='addlayer'){const ty=$('#newType').value;Z.layers.push(LY(ty,Math.floor(Math.random()*Math.min(4,T().colors.length)),.3,1,Math.round(Math.random()*60-30)))}
 if(a=='dellayer'){Z.layers=Z.layers.filter(l=>l.id!=id);LC.delete(id)}
 if(a=='adddriver'){const pid=uid();S.drivers.push({id:uid(),name:'Driver '+(S.drivers.length+1),team:T().id,poses:[{id:pid,name:'Pose 1',photo:'',ph:{}}],pose:pid})}
 if(a=='selpose'){S.drivers.find(x=>x.id==id).pose=b.dataset.pid}
 if(a=='addpose'){const dr=S.drivers.find(x=>x.id==id);if(dr.poses.length<4){const p={id:uid(),name:'Pose '+(dr.poses.length+1),photo:'',ph:{}};dr.poses.push(p);dr.pose=p.id}}
 if(a=='delpose'){const dr=S.drivers.find(x=>x.id==id);if(dr.poses.length>1){dr.poses=dr.poses.filter(p=>p.id!=b.dataset.pid);dr.pose=dr.poses[0].id}}
 if(a=='preset'){const k=b.dataset.k,keep=Z.layers.filter(l=>LINE.includes(l.type));Z.layers=[...PRESETS[k](),...keep];
  if(presetCol=='ref'){const col=k=='gray'?'#b9b9b9':'#ff8a00';Z.bg.mode='custom';Z.bg.a=col;Z.bg.b=col}else Z.bg.mode='flat'}
 if(a=='addline')Z.layers.push(LY(b.dataset.k,4,.95,1,0));
 if(a=='dellines')Z.layers=Z.layers.filter(l=>!LINE.includes(l.type));
 if(a=='dpreset'){const o=b.dataset.k=='wtxt'?Z.txt:Z.pt[b.dataset.k];o.ox=0;o.oy=0}
 if(a=='deldriver'&&S.drivers.length>1){S.drivers=S.drivers.filter(d=>d.id!=id);if(S.cur==id)S.cur=S.drivers[0].id;if(S.curs)for(const k in S.curs)if(S.curs[k]==id)S.curs[k]=S.drivers[0].id;syncName()}
 if(a=='addteam')S.teams.push({id:uid(),name:'Tim Baru',logo:'',colors:['#d11a2a','#1a1d22']});
 if(a=='delteam'){S.teams=S.teams.filter(x=>x.id!=id);S.drivers.forEach(d=>{if(d.team==id)d.team=S.teams[0].id})}
 if(a=='addcol'&&tm.colors.length<4){const i=document.getElementById('nh-'+id);tm.colors.push(nh(i&&i.value)||'#888888')}
 if(a=='delcolat'&&tm.colors.length>1)tm.colors.splice(+b.dataset.i,1);
 if(a=='resetph'){const pz=curPose();if(pz){pz.ph=pz.ph||{};pz.ph[S.tpl]=Object.assign({},defaults().tp[S.tpl].ph)}}
 if(a=='tpos'){Z.txt.pos=b.dataset.p;Z.txt.ox=0;Z.txt.oy=0}
 if(a=='ptpos'){const it=Z.pt[b.dataset.k];it.pos=b.dataset.p;it.ox=0;it.oy=0;selTx=b.dataset.k}
 if(a=='seltx')selTx=b.dataset.k;
 if(a=='resettext'){const d=winnerD().txt;Z.txt.pos=d.pos;Z.txt.ox=0;Z.txt.oy=0;Z.txt.m=d.m}
 if(a=='tlpos'){Z.tl.pos=b.dataset.p;Z.tl.ox=0;Z.tl.oy=0;selLogo='team'}
 if(a=='selteam')selLogo='team';
 if(a=='sel')selLogo=id;
 if(a=='pos'&&lg)snap(lg,b.dataset.p);
 if(a=='dellogo'){Z.logos=Z.logos.filter(l=>l.id!=id);fixSel()}
 if(a=='bkexp'){const bl=new Blob([JSON.stringify(S)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(bl);l.download='poster-studio-data.json';l.click();return}
 if(a=='bkimp'){document.getElementById('bkf').click();return}
 if(a=='export'){const c=document.createElement('canvas');c.width=W*2;c.height=H*2;render(c.getContext('2d'),2,false);c.toBlob(bl=>{const l=document.createElement('a');l.href=URL.createObjectURL(bl);l.download='poster-'+S.tpl+'-'+((D()||{}).name||'driver').replace(/\W+/g,'-')+'.png';l.click()});return}
 save();ui()});
// geser, cubit dua jari, dan zoom
const P=new Map();
function nudge(dx,dy){const Z=Q();
 if(tab==LG){if(selLogo=='team'){Z.tl.ox+=dx;Z.tl.oy+=dy}else{const l=Z.logos.find(a=>a.id==selLogo);if(l){l.x+=dx;l.y+=dy}}return}
 if(tab==TX){if(S.tpl=='pole'){const it=Z.pt[selTx];it.ox+=dx;it.oy+=dy}else{Z.txt.ox+=dx;Z.txt.oy+=dy}return}
 const ph=PH();ph.x+=dx;ph.y+=dy}
function pinch(r){const Z=Q();
 if(tab==LG){if(selLogo=='team')Z.tl.sz=cl(Z.tl.sz*r,30,300);else{const l=Z.logos.find(a=>a.id==selLogo);if(l)l.w=cl(l.w*r,40,900)}return}
 if(tab==TX){if(S.tpl=='pole'){const it=Z.pt[selTx];it.z=cl(it.z*r,10,600)}else{const x=Z.txt;x.nz=cl(x.nz*r,12,140);x.hz=cl(x.hz*r,40,420);x.sz=cl(x.sz*r,12,140)}return}
 const ph=PH();ph.s=cl(ph.s*r,.3,3)}
const dist=()=>{const [a,b]=[...P.values()];return Math.hypot(a.x-b.x,a.y-b.y)};
cv.addEventListener('pointerdown',e=>{P.set(e.pointerId,{x:e.clientX,y:e.clientY});cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{const o=P.get(e.pointerId);if(!o)return;const k=W/cv.getBoundingClientRect().width;
 if(P.size>=2){const d0=dist();P.set(e.pointerId,{x:e.clientX,y:e.clientY});const d1=dist();if(d0>0)pinch(d1/d0)}
 else{nudge((e.clientX-o.x)*k,(e.clientY-o.y)*k);P.set(e.pointerId,{x:e.clientX,y:e.clientY})}
 draw()});
const up=e=>{P.delete(e.pointerId);if(!P.size){save();if(tab==0||tab==TX||tab==LG)ui()}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();pinch(e.deltaY<0?1.05:.95);draw();save()},{passive:false});
// tombol arah (tahan untuk geser terus)
let rep=null;
const padMove=(k,dx,dy)=>{const o=k=='wtxt'?Q().txt:Q().pt[k];o.ox+=dx;o.oy+=dy};
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-dp]');if(!b)return;e.preventDefault();
 const k=b.dataset.dp,dx=+b.dataset.dx,dy=+b.dataset.dy,go=s=>{padMove(k,dx*s,dy*s);draw()};go(2);
 rep={t:setTimeout(()=>{rep.i=setInterval(()=>go(8),50)},350)}});
const stopPad=()=>{if(rep){clearTimeout(rep.t);clearInterval(rep.i);rep=null;save();ui()}};
document.addEventListener('pointerup',stopPad);document.addEventListener('pointercancel',stopPad);
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-dp]'))e.preventDefault()});
// mulai
ui();
load().then(d=>{if(d){try{S=mig(d)}catch(err){console.log('mig gagal',err.message)}}return fontsReady}).then(()=>Promise.all(S.fonts.map(f=>loadF(f.v,`url(${f.d})`)))).then(()=>ui());
